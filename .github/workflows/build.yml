name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # El runner de GitHub ya trae el SDK de Android instalado (ANDROID_HOME).
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: gradle assembleRelease --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk senal-${{ github.run_number }}.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: senal-apk
          path: senal-*.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Señal (versión de prueba ${{ github.run_number }})
          prerelease: true
          files: senal-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
